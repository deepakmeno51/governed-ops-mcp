name: governed-ops

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrate:
    build: ./migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AGENT_RO_PASSWORD: ${AGENT_RO_PASSWORD:?set AGENT_RO_PASSWORD in .env}
      AGENT_RW_PASSWORD: ${AGENT_RW_PASSWORD:?set AGENT_RW_PASSWORD in .env}
      AUDIT_WRITER_PASSWORD: ${AUDIT_WRITER_PASSWORD:?set AUDIT_WRITER_PASSWORD in .env}
      OPS_EXECUTOR_PASSWORD: ${OPS_EXECUTOR_PASSWORD:?set OPS_EXECUTOR_PASSWORD in .env}
      APPROVAL_DECIDER_PASSWORD: ${APPROVAL_DECIDER_PASSWORD:?set APPROVAL_DECIDER_PASSWORD in .env}

  mcp-server:
    build: ./mcp_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mock-service:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      AGENT_RO_PASSWORD: ${AGENT_RO_PASSWORD}
      AGENT_RW_PASSWORD: ${AGENT_RW_PASSWORD}
      AUDIT_WRITER_PASSWORD: ${AUDIT_WRITER_PASSWORD}
      OPS_EXECUTOR_PASSWORD: ${OPS_EXECUTOR_PASSWORD}
      APPROVAL_TTL_MINUTES: ${APPROVAL_TTL_MINUTES:-10}
      TOOL_TIMEOUT_SECONDS: ${TOOL_TIMEOUT_SECONDS:-30}
      EXECUTION_STALE_SECONDS: ${EXECUTION_STALE_SECONDS:-120}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-30}
      MOCK_SERVICE_URL: http://mock-service:8000
      UI_URL: http://approval-ui:8000
      # Dev-only tokens. Format: token:actor:role,... Override in .env.
      MCP_API_TOKENS: ${MCP_API_TOKENS:-dev-operator-token:alice:operator,dev-viewer-token:bob:viewer,dev-operator2-token:dana:operator}
      MCP_TRANSPORT: streamable-http
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  approval-ui:
    build:
      context: .
      dockerfile: approval_ui/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      APPROVAL_DECIDER_PASSWORD: ${APPROVAL_DECIDER_PASSWORD}
      AUDIT_WRITER_PASSWORD: ${AUDIT_WRITER_PASSWORD}
      # Dev-only approver logins. Format: name:password,... Override in .env.
      # alice is also an operator, so she can test that self-approval is refused.
      APPROVERS: ${APPROVERS:-carol:dev-approver-pass,alice:dev-alice-pass}
    ports:
      - "127.0.0.1:8003:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  mock-service:
    build: ./mock_service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---- Isolated test stack (profile "test"). Nothing here touches the real database or audit log. ----
  # Run:  docker compose --profile test run --rm tests
  # Its Postgres lives in memory, has no published port, and is thrown away afterwards.
  # The passwords below are throwaway values for that private database, not secrets.
  postgres-test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ops_admin
      POSTGRES_PASSWORD: testadminpw
      POSTGRES_DB: ops_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops_admin -d ops_test"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate-test:
    profiles: ["test"]
    build: ./migrate
    restart: "no"
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres-test
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ops_admin
      POSTGRES_PASSWORD: testadminpw
      POSTGRES_DB: ops_test
      AGENT_RO_PASSWORD: testropw
      AGENT_RW_PASSWORD: testrwpw
      AUDIT_WRITER_PASSWORD: testauditpw
      OPS_EXECUTOR_PASSWORD: testexecpw
      APPROVAL_DECIDER_PASSWORD: testdecpw

  tests:
    profiles: ["test"]
    build: ./mcp_server
    depends_on:
      postgres-test:
        condition: service_healthy
      migrate-test:
        condition: service_completed_successfully
    environment:
      GOVERNED_TEST_DB: "1"
      DB_HOST: postgres-test
      DB_PORT: "5432"
      DB_NAME: ops_test
      POSTGRES_USER: ops_admin
      POSTGRES_PASSWORD: testadminpw
      AGENT_RO_PASSWORD: testropw
      AGENT_RW_PASSWORD: testrwpw
      AUDIT_WRITER_PASSWORD: testauditpw
      OPS_EXECUTOR_PASSWORD: testexecpw
      APPROVAL_DECIDER_PASSWORD: testdecpw
      MCP_API_TOKENS: dev-operator-token:alice:operator,dev-viewer-token:bob:viewer,dev-operator2-token:dana:operator
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]

volumes:
  pgdata:
